[project]
name = "language-model"
version = "0.1.0"
description = "A language model built from scratch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8",
    "einx>=0.4",
    "jaxtyping>=0.3",
    "regex>=2026.3.32",
    "torch~=2.11.0",
]

[dependency-groups]
dev = [
    "numpy>=2.4",
    "psutil>=7",
    "pytest>=9.0",
    "ruff>=0.15.8",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
